<!DOCTYPE html>
  <html>
    <head>
      <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
      <link type="text/css" rel="stylesheet" href="./static/css/materialize.min.css"  media="screen,projection"/>
      <link type="text/css" rel="stylesheet" href="./static/css/styles.css"  media="screen,projection"/>
      <script type="text/javascript" src="./static/js/materialize.min.js"></script>
      <script type="text/javascript" src="js/persona.js"></script>

      <script type="text/javascript" src="js/main.js"></script>

    <body>
        <main>
            <!-- Navigation bar -->
            <nav style="background-color:#124580">
                <div class="nav-wrapper">
                    <a href="#!" class="brand-logo left" style="margin-left: 15px;">Smart Home</a>
                    <ul id="nav-mobile" class="right" style="margin-right: 15px;">
                        <li><a href="#">Help</a></li>
                    </ul>
                </div>
            </nav>	
            <!-- Page Body -->
            <div class="container">
                <br/>
                <h3>Lista de dispositivos</h3>
                <br/>
                <div class="row">
                    <div class="input-field col s12 m12 l12 xl12">
                        <textarea id="textarea_1" class="materialize-textarea" style="height: 80px;" readonly></textarea>
                    </div>
                    <div class="col s4 m4 l4 xl4">
                        <button class="btn waves-effect waves-light button-view" id="boton_agregar" name="hello_button">Agregar</button>
                        <a class="btn waves-effect waves-light button-view" id="boton_enviar" name="hello_button">Enviar</a>
                    </div>
                        <div class="col s6 m12 l8 xl12">
                        <modal id="modal_agregar_dispositivo" class="modal">
                            <div class="modal-content">
                                <h4>Agregar dispositivo</h4>
                                <p><input type="text" placeholder="Nombre del dispositivo"/></p>
                                <p><input type="text" placeholder="Ubicación del dispositivo"/></p>
                                <p><input type="text" placeholder="Estado del dispositivo"/></p>
                                <button class="btn waves-effect waves-light button-view" id="boton_modal_agregar_dispositivo" name="boton_modal_agregar_dispositivo">Agregar</button>
                                <button class="btn waves-effect waves-light button-view" id="boton_modal_cancelar" name="boton_modal_cancelar">Cancelar</button>
                            </div>
                            <div class="modal-footer">
                                <a href="#!" class="modal-close waves-effect waves-green btn-flat">Agree</a>
                            </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col s4 m4 l4 xl4">
                        <ul class="dev_collection", id="dev_collection">
                            <!--<div class="card blue-grey darken-1">
                                <div class="card-content white-text">
                                <span class="Device 1">Dispositivo 1</span>
                                <p>Device 1</p>
                                </div>
                                <div class="card-action">
                                <a class="waves-effect waves-light btn">Encender</a>
                                <a class="waves-effect waves-light btn">Apagar</a>
                                </div>
                            </div>-->
                        </ul>
                    </div>
            </div>	
        </main>
		<!-- Page Footer -->
        <footer class="page-footer" style="background-color:#124580">
            <div class="container">
                <div class="row">
                    <div class="col l6 s6">
                        <h5 class="white-text">Smart Home</h5>

                    </div>
                    <div class="col l6 s6">
                        <h5 class="white-text right-align">Contact</h5>
                        <p class="white-text right-align">
                            <a class="grey-text text-lighten-3" href="!#">Email | </a>
                            <a class="grey-text text-lighten-3" href="!#">Twitter | </a>
                            <a class="grey-text text-lighten-3" href="!#">LinkedIn</a>
                        </p>
